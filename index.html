<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hồ Sơ Scan">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071628" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Hồ Sơ Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column, sticky top bar, fixed bottom tabs; giấy tờ shown as paper slips on a sea-blue desk */
:root{
  --bg:#FFFFFF; --surface:#F2F7FC; --surface-2:#E4EEF9; --line:#D2E1F1;
  --ink:#0B2340; --muted:#587089;
  --sea:#0A5BB5; --sea-strong:#074A95; --sea-soft:#E3EEFB; --on-sea:#FFFFFF;
  --bad:#BE3A2E; --bad-soft:#FCEBE8; --warn:#8F5E00; --warn-soft:#FFF3D9; --ok:#1B7549; --ok-soft:#E4F4EB;
  --paper:#FFFFFF; --shadow:0 1px 2px rgba(10,45,90,.06),0 4px 14px rgba(10,45,90,.06);
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071628; --surface:#0D2138; --surface-2:#132B47; --line:#1F3B5C;
  --ink:#E6F0FB; --muted:#93AAC4;
  --sea:#4FA2F2; --sea-strong:#7AB9F6; --sea-soft:#12304F; --on-sea:#061528;
  --bad:#FF8A7D; --bad-soft:#3A1C1C; --warn:#F2C25C; --warn-soft:#352914; --ok:#6FD3A0; --ok-soft:#12302A;
  --paper:#0F2540; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071628; --surface:#0D2138; --surface-2:#132B47; --line:#1F3B5C;
  --ink:#E6F0FB; --muted:#93AAC4;
  --sea:#4FA2F2; --sea-strong:#7AB9F6; --sea-soft:#12304F; --on-sea:#061528;
  --bad:#FF8A7D; --bad-soft:#3A1C1C; --warn:#F2C25C; --warn-soft:#352914; --ok:#6FD3A0; --ok-soft:#12302A;
  --paper:#0F2540; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
button{-webkit-tap-highlight-color:transparent}
/* chỉ cuộn lên xuống, không bao giờ lệch ngang */
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
main,.top,.tabs{max-width:100vw}
main>*{min-width:0;max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px}
.top h1 .ver{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--sea);background:var(--sea-soft);padding:2px 7px;border-radius:6px;vertical-align:middle;margin-left:4px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--sea);display:grid;place-items:center;flex:none}
.brand-mark svg{width:16px;height:16px;stroke:var(--on-sea)}
.back{border:0;background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:18px;height:18px;stroke:var(--ink)}
.mode{font-size:11px;color:var(--muted);white-space:nowrap}

main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(var(--tabh) + 28px)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor}
.tab[aria-current="page"]{color:var(--sea)}
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px;stroke:currentColor}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.btn.primary:active{background:var(--sea-strong)}
.btn.ghost{border-color:transparent;background:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Scan hero: viewfinder with corner brackets */
.finder{position:relative;border-radius:20px;background:var(--surface);padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.finder .corners{position:absolute;inset:14px;pointer-events:none}
.finder .corners i{position:absolute;width:26px;height:26px;border:3px solid var(--sea)}
.finder .corners i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:10px}
.finder .corners i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:10px}
.finder .corners i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:10px}
.finder .corners i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:10px}
.finder h2{font-size:21px;font-weight:700}
.finder p{margin:0;max-width:34ch}
.shutter{width:76px;height:76px;border-radius:50%;background:var(--sea);border:5px solid var(--sea-soft);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 2px var(--sea)}
.shutter svg{width:30px;height:30px;stroke:var(--on-sea)}
.shutter:active{transform:scale(.96)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--sea);border:1px solid var(--line)}

/* Pages strip */
.pages{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.page{position:relative;flex:none;width:96px;aspect-ratio:3/4;max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.page img{width:100%;height:100%;object-fit:cover;display:block}
.page .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:0;background:rgba(7,22,40,.7);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.page .n{position:absolute;left:6px;bottom:4px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pg{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none;width:112px}
.pg .page{width:100%;aspect-ratio:auto;height:140px}
.pg .page.cut img{object-fit:contain;background:var(--surface-2)}
.pg .btn{padding:0 6px;font-size:12px;min-height:34px}
.cut-st{font-size:11px;font-weight:600;text-align:center}
.cut-st.ok{color:var(--ok)} .cut-st.no{color:var(--warn)}
/* Chỉnh khung cắt 4 góc */
.crop-wrap{position:relative;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;border-radius:8px;overflow:hidden;background:#000}
.crop-wrap canvas,.crop-wrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.crop-wrap .loupe{position:absolute;top:8px;width:116px;height:116px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.4);overflow:hidden;pointer-events:none;background:#000}
.crop-wrap .loupe canvas{position:static;width:100%;height:100%}

/* Sections & cards */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:16px;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:10px}

.slip{display:flex;gap:12px;align-items:center;padding:10px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow)}
.slip .thumb{width:54px;height:68px;border-radius:8px;flex:none;overflow:hidden;background:var(--sea-soft);display:grid;place-items:center}
.slip .thumb img{width:100%;height:100%;object-fit:cover}
.slip .thumb .code{font-family:var(--font-mono);font-size:9px;font-weight:500;color:var(--sea);text-align:center;line-height:1.2;padding:2px}
.slip .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.slip .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.slip .s{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slip .chev{width:16px;height:16px;stroke:var(--muted);flex:none}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sea-soft);color:var(--sea);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.neutral{background:var(--surface);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* Folder rows */
.folder{display:flex;gap:12px;align-items:center;padding:12px;width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow)}
.folder .ico{width:42px;height:42px;border-radius:11px;background:var(--sea-soft);display:grid;place-items:center;flex:none}
.folder .ico svg{width:22px;height:22px;stroke:var(--sea)}
.folder .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.folder .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.folder .s{display:block}
.folder .tags{margin-top:2px}
.folder .pill,.slip .chev{flex:none}
.folder .s{font-size:13px;color:var(--muted)}

.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}

/* Form */
.form-card{padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%;min-width:0}
.field input.mono{font-family:var(--font-mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.person-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.person-h h3{font-size:15px;font-weight:700}
.folder-pick{background:var(--sea-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.folder-pick label{font-size:12px;font-weight:600;color:var(--sea)}
.folder-pick select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;width:100%}
.folder-pick .why{font-size:12px;color:var(--muted)}
.type-pick{display:flex;flex-wrap:wrap;gap:6px}
.type-pick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.type-pick button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.note{border-radius:12px;padding:10px 12px;font-size:13px}
.note.info{background:var(--sea-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.bad{background:var(--bad-soft);color:var(--ink)}
.namecrop{width:100%;max-height:72px;object-fit:contain;object-position:left center;background:#fff;border:1px solid var(--line);border-radius:8px}
.raw summary{font-size:13px;font-weight:600;color:var(--sea);cursor:pointer}
.raw pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:12px;background:var(--surface);border-radius:10px;padding:10px;max-height:240px;overflow:auto;margin:8px 0 0}

/* Issues */
.issue{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper)}
.issue.bad{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.issue.warn{border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
.issue .head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.issue .head b{font-size:14px}
.vs{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:4px 10px;font-size:14px;align-items:baseline}
.vs .src{font-size:12px;color:var(--muted);max-width:42vw;overflow-wrap:anywhere}
.vs .val{min-width:0;overflow-wrap:anywhere;font-weight:500}
mark{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:0 2px;font-weight:700}
.issue.warn mark{background:var(--warn-soft);color:var(--warn)}

/* Compare table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{background:var(--surface);font-size:12px;font-weight:600;white-space:nowrap}
tbody th{font-weight:600;color:var(--muted);white-space:nowrap;position:sticky;left:0;background:var(--paper)}
td{min-width:130px}
td.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
td.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
td.ref{font-weight:600}
td.empty{color:var(--muted)}
tr:last-child th,tr:last-child td{border-bottom:0}

/* Doc view */
.doc-imgs{display:flex;gap:10px;overflow-x:auto}
.doc-imgs img{height:220px;max-width:100%;border-radius:10px;border:1px solid var(--line);flex:none;object-fit:contain;background:var(--surface)}
.ph-img{height:160px;border-radius:12px;background:var(--surface);display:grid;place-items:center;text-align:center;padding:16px;width:100%}

.reading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 16px;text-align:center}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--sea-soft);border-top-color:var(--sea);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scanline{position:relative;width:120px;height:150px;border-radius:10px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.scanline img{width:100%;height:100%;object-fit:cover;opacity:.85}
.scanline::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--sea);box-shadow:0 0 12px var(--sea);top:0;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
@media (prefers-reduced-motion:reduce){.spinner,.scanline::after{animation:none}}

.empty-st{padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty-st svg{width:40px;height:40px;stroke:var(--sea)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sea-soft);border-radius:12px;padding:10px 12px;font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.summary b{font-size:22px;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}
.summary .bad b{color:var(--bad)} .summary .warn b{color:var(--warn)} .summary .ok b{color:var(--ok)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;height:36px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:var(--shadow)}
img[data-zoom]{cursor:zoom-in}
#printArea{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .pp{width:210mm;height:297mm;position:relative;overflow:hidden;break-after:page;page-break-after:always}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .pp img{position:absolute;max-width:none}
}

/* Bố cục in A4: tờ giấy luôn trắng như giấy thật */
.sheet-wrap{display:flex;flex-direction:column;gap:6px;align-items:center}
.sheet{position:relative;width:100%;max-width:520px;aspect-ratio:210/297;background:#fff;box-shadow:0 1px 3px rgba(10,30,60,.18),0 8px 24px rgba(10,30,60,.12);overflow:hidden;touch-action:pan-y;border-radius:2px}
.sheet.editing{touch-action:none}
.sheet::after{content:"";position:absolute;inset:0;border:1px dashed rgba(10,91,181,.0);pointer-events:none}
.sheet.editing::after{border-color:rgba(10,91,181,.25)}
.pi{position:absolute;touch-action:pan-y}
.pi.sel{outline:2px solid var(--sea);outline-offset:0;touch-action:none;z-index:2}
.pi img{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.pi .h{position:absolute;right:-11px;bottom:-11px;width:24px;height:24px;border-radius:50%;background:var(--sea);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);touch-action:none}
.ptools{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 10px);z-index:3;padding:12px;display:flex;flex-direction:column;gap:10px}
.ptools input[type=range]{width:100%;accent-color:var(--sea)}
.ptools .row .btn{flex:1;min-width:0;padding:0 8px}

/* Hashtag thư mục */
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--sea);background:var(--sea-soft);border-radius:8px;padding:3px 4px 3px 9px;max-width:100%;min-width:0}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag button{border:0;background:none;color:var(--sea);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:16px;line-height:1;flex:none}
.tag.ro{padding-right:9px;font-size:12px;padding-block:1px}
.tag-add{display:flex;gap:8px}
.tag-add input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.ftags{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ftags button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.ftags button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}

/* Xem ảnh toàn màn hình: luôn nền tối để nhìn rõ giấy tờ */
.viewer{position:fixed;inset:0;z-index:30;background:rgba(3,10,20,0);transition:background .25s ease}
.viewer.on{background:rgba(3,10,20,.96)}
.v-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.v-stage img{position:absolute;transform-origin:0 0;max-width:none;-webkit-user-drag:none;will-change:transform;border-radius:2px}
.v-bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;color:#fff;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.viewer.on .v-bar{opacity:1}
.v-bar button,.v-nav{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .2s}
.viewer.on .v-nav{opacity:1}
.v-nav.prev{left:10px} .v-nav.next{right:10px}
.v-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);background:rgba(255,255,255,.14);color:#fff;font-size:13px;padding:7px 12px;border-radius:999px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.v-zoom{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);color:#fff;font-size:12px;font-family:var(--font-mono);opacity:.75;pointer-events:none}
</style>

<script>
/* ---------- Từ điển ---------- */
const TYPES = {
  cccd:{short:'CCCD',name:'Căn cước công dân'},
  cmnd:{short:'CMND',name:'Chứng minh nhân dân'},
  ket_hon:{short:'Kết hôn',name:'Giấy chứng nhận kết hôn'},
  khai_sinh:{short:'Khai sinh',name:'Giấy khai sinh'},
  khai_tu:{short:'Khai tử',name:'Giấy khai tử'},
  ho_khau:{short:'Hộ khẩu',name:'Sổ hộ khẩu'},
  so_do:{short:'Sổ đỏ',name:'GCN quyền sử dụng đất'},
  mua_ban:{short:'Mua bán',name:'Giấy mua bán viết tay'},
  khac:{short:'Khác',name:'Giấy tờ khác'}
};
const TYPE_ORDER = ['cccd','cmnd','khai_sinh','ket_hon','ho_khau','khai_tu','so_do','mua_ban','khac'];
const LAND_TYPES = new Set(['so_do','mua_ban']);
const ROLES = {
  chu_the:'Chủ thẻ', chong:'Chồng', vo:'Vợ', cha:'Cha', me:'Mẹ', nguoi_mat:'Người đã mất',
  chu_ho:'Chủ hộ', thanh_vien:'Thành viên hộ', nguoi_khai:'Người đi khai',
  chu_su_dung:'Người sử dụng đất', ben_ban:'Bên bán', ben_mua:'Bên mua', lam_chung:'Người làm chứng'
};
const ROLE_BY_TYPE = {
  cccd:['chu_the'], cmnd:['chu_the'], ket_hon:['chong','vo'], khai_sinh:['chu_the','cha','me','nguoi_khai'],
  khai_tu:['nguoi_mat','nguoi_khai'], ho_khau:['chu_ho','thanh_vien'],
  so_do:['chu_su_dung'], mua_ban:['ben_ban','ben_mua','lam_chung'], khac:['chu_the']
};
const PRIMARY = new Set(['chu_the','chong','vo','nguoi_mat','chu_ho','thanh_vien','chu_su_dung','ben_ban','ben_mua']);
/* Thông tin thửa đất (sổ đỏ, giấy mua bán) */
const LAND_FIELDS = [
  {k:'thua_so',label:'Thửa đất số',kind:'id',level:'bad',mono:true},
  {k:'to_ban_do',label:'Tờ bản đồ số',kind:'id',level:'bad',mono:true},
  {k:'dien_tich',label:'Diện tích (m²)',kind:'area',level:'bad',mono:true},
  {k:'dia_chi_dat',label:'Địa chỉ thửa đất',kind:'addr',level:'warn'},
  {k:'muc_dich',label:'Mục đích sử dụng',kind:'text',level:'warn'},
  {k:'so_phat_hanh',label:'Số phát hành (seri sổ)',kind:'id',level:'bad',mono:true,only:'so_do'},
  {k:'so_vao_so',label:'Số vào sổ cấp GCN',kind:'text',level:'bad',mono:true,only:'so_do'},
  {k:'gia_tien',label:'Giá mua bán',kind:'text',level:'warn',only:'mua_ban'}
];
const LAND_CMP = ['thua_so','to_ban_do','dien_tich','dia_chi_dat','muc_dich'];
function roleLabel(role, type){
  if(role==='chu_the' && type==='khai_sinh') return 'Người được khai sinh';
  if(role==='chu_the' && type==='khac') return 'Người đứng tên';
  if(role==='chu_su_dung') return 'Chủ sử dụng đất';
  return ROLES[role] || role || 'Người';
}
/* level: bad = phải khớp; warn = có thể khác hợp lệ (đổi địa chỉ, sáp nhập hành chính) */
const FIELDS = [
  {k:'ho_ten',label:'Họ, chữ đệm và tên',kind:'name',level:'bad'},
  {k:'ngay_sinh',label:'Ngày sinh',kind:'date',level:'bad',ph:'dd/mm/yyyy'},
  {k:'gioi_tinh',label:'Giới tính',kind:'text',level:'bad'},
  {k:'so_cccd',label:'Số CCCD / định danh',kind:'id',level:'bad',mono:true},
  {k:'so_cmnd',label:'Số CMND',kind:'id',level:'bad',mono:true},
  {k:'dan_toc',label:'Dân tộc',kind:'text',level:'bad'},
  {k:'quoc_tich',label:'Quốc tịch',kind:'text',level:'bad'},
  {k:'que_quan',label:'Quê quán',kind:'addr',level:'warn'},
  {k:'noi_sinh',label:'Nơi sinh',kind:'addr',level:'warn'},
  {k:'noi_thuong_tru',label:'Nơi thường trú / cư trú',kind:'addr',level:'warn'},
  {k:'ngay_mat',label:'Ngày mất',kind:'date',level:'bad',ph:'dd/mm/yyyy'}
];
const FIELDS_BY_TYPE = {
  cccd:['ho_ten','ngay_sinh','so_cccd'],
  cmnd:['ho_ten','ngay_sinh','so_cmnd'],
  ket_hon:['ho_ten','ngay_sinh','dan_toc','quoc_tich','so_cccd','so_cmnd','noi_thuong_tru'],
  khai_sinh:['ho_ten','ngay_sinh','gioi_tinh','dan_toc','quoc_tich','noi_sinh','que_quan','so_cccd','noi_thuong_tru'],
  khai_tu:['ho_ten','ngay_sinh','gioi_tinh','dan_toc','quoc_tich','so_cccd','so_cmnd','noi_thuong_tru','ngay_mat'],
  ho_khau:['ho_ten','ngay_sinh','gioi_tinh','que_quan','dan_toc','quoc_tich','so_cmnd','so_cccd','noi_thuong_tru'],
  so_do:['ho_ten','ngay_sinh','so_cccd','so_cmnd','noi_thuong_tru'],
  mua_ban:['ho_ten','ngay_sinh','so_cccd','so_cmnd','noi_thuong_tru'],
  khac:FIELDS.map(f=>f.k)
};
const FIELD = Object.fromEntries([...FIELDS, ...LAND_FIELDS].map(f=>[f.k,f]));

/* ---------- Tiện ích ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clean = v => (v==null ? '' : String(v)).normalize('NFC').replace(/\s+/g,' ').trim();
const up = s => clean(s).toLocaleUpperCase('vi');
const base = s => up(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/Đ/g,'D').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const digits = s => clean(s).replace(/\D/g,'');
function titleCase(s){ return clean(s).toLocaleLowerCase('vi').split(' ').map(w=>w ? w[0].toLocaleUpperCase('vi')+w.slice(1) : w).join(' '); }
function parseDate(s){
  s = clean(s); if(!s) return null;
  let m = s.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{4})/);
  if(m) return {d:+m[1], m:+m[2], y:+m[3]};
  m = s.match(/^\D*(\d{4})\D*$/);
  if(m) return {y:+m[1]};
  return null;
}
const p2 = n => String(n).padStart(2,'0');
/* "1.250,5 m2" / "120,5m²" / "120.5" → số */
function parseArea(s){
  let t = clean(s).replace(/m\s*[2²]|mét vuông|m vuông/gi,'').replace(/[^\d.,]/g,'');
  if(!t) return null;
  if(t.includes(',') && t.includes('.')) t = t.lastIndexOf(',')>t.lastIndexOf('.') ? t.replace(/\./g,'').replace(',','.') : t.replace(/,/g,'');
  else if(t.includes(',')) t = t.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,'');
  const n = parseFloat(t); return isFinite(n) ? n : null;
}
const fmtNum = n => (Math.round(n*100)/100).toLocaleString('vi-VN');
function fmtDate(p){ return p ? (p.d ? `${p2(p.d)}/${p2(p.m)}/${p.y}` : `${p.y}`) : ''; }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
const ICON = {
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  compare:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/><path d="M6 9h2M6 13h2M16 9h2M16 13h2"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  printer:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg>'
};

/* ---------- Lưu trữ: db của Claude (riêng tư theo tài khoản), dự phòng trên máy ---------- */
/* Lưu trữ ngay trên máy (IndexedDB): hồ sơ ở kho "items", ảnh ở kho "imgs" */
const Store = {
  mode:'loading', items:new Map(), imgCache:new Map(), subs:new Set(), db:null,
  on(fn){ this.subs.add(fn); }, emit(){ this.subs.forEach(f=>f()); },
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('ho-so-scan',1);
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('items')) d.createObjectStore('items',{keyPath:'id'}); if(!d.objectStoreNames.contains('imgs')) d.createObjectStore('imgs'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  tx(store, mode, fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode), s=t.objectStore(store); let out; const r=fn(s); if(r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  async init(){
    try{
      this.db=await this.open();
      const all=await this.tx('items','readonly',s=>s.getAll());
      this.items=new Map((all||[]).map(x=>[x.id,x]));
      this.mode='local';
      try{ if(navigator.storage?.persist) navigator.storage.persist(); }catch(e){}
    }catch(e){ this.mode='memory'; toast('Không mở được bộ nhớ máy. Dữ liệu chỉ giữ tới khi đóng app.'); }
    this.emit();
  },
  async put(obj){ this.items.set(obj.id, obj); if(this.db) await this.tx('items','readwrite',s=>s.put(obj)); this.emit(); },
  async del(id){ this.items.delete(id); if(this.db) await this.tx('items','readwrite',s=>s.delete(id)); this.emit(); },
  async putImg(id, data){ this.imgCache.set(id,data); if(this.db) await this.tx('imgs','readwrite',s=>s.put(data,id)); },
  async getImg(id){ if(this.imgCache.has(id)) return this.imgCache.get(id); let v=null; if(this.db){ try{ v=await this.tx('imgs','readonly',s=>s.get(id)); }catch(e){} } if(v) this.imgCache.set(id,v); return v||null; },
  async delImg(id){ this.imgCache.delete(id); if(this.db) await this.tx('imgs','readwrite',s=>s.delete(id)); },
  async allImgs(){ if(!this.db) return Object.fromEntries(this.imgCache); return new Promise((res,rej)=>{ const out={}; const t=this.db.transaction('imgs','readonly'); const c=t.objectStore('imgs').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }); },
  async clearAll(){ this.items=new Map(); this.imgCache=new Map(); if(this.db){ await this.tx('items','readwrite',s=>s.clear()); await this.tx('imgs','readwrite',s=>s.clear()); } this.emit(); }
};
const folders = () => [...Store.items.values()].filter(x=>x.kind==='folder').sort((a,b)=>a.name.localeCompare(b.name,'vi'));
const docs = () => [...Store.items.values()].filter(x=>x.kind==='doc').sort((a,b)=>(b.scannedAt||0)-(a.scannedAt||0));
const getItem = id => Store.items.get(id);
const normTag = t => clean(t).replace(/^#+/,'').trim().slice(0,60);
function allTags(){ const m=new Map(); folders().forEach(f=>(f.tags||[]).forEach(t=>{ const k=base(t); if(!m.has(k)) m.set(k,t); })); return [...m.values()].sort((a,b)=>a.localeCompare(b,'vi')); }

/* ---------- Đối chiếu ---------- */
function entriesFor(folderId){
  const out=[];
  for(const d of docs()) (d.people||[]).forEach((p,i)=>{ if((p.folderId||null)===folderId) out.push({doc:d,p,i}); });
  return out.sort((a,b)=>TYPE_ORDER.indexOf(a.doc.type)-TYPE_ORDER.indexOf(b.doc.type));
}
function cmp(f, a, b){
  if(f.kind==='name'){
    if(up(a)===up(b)) return {st:'ok'};
    if(base(a)===base(b)) return {st:'bad', reason:'Khác dấu'};
    return {st:'bad', reason:'Khác tên'};
  }
  if(f.kind==='date'){
    const pa=parseDate(a), pb=parseDate(b);
    if(!pa||!pb) return clean(a)===clean(b) ? {st:'ok'} : {st:f.level, reason:'Khác nhau'};
    if(pa.y!==pb.y) return {st:'bad', reason:'Lệch năm'};
    if(!pa.d||!pb.d) return {st:'ok'};
    const parts=[]; if(pa.d!==pb.d) parts.push('ngày'); if(pa.m!==pb.m) parts.push('tháng');
    return parts.length ? {st:'bad', reason:'Lệch '+parts.join(', ')} : {st:'ok'};
  }
  if(f.kind==='id') return digits(a)===digits(b) ? {st:'ok'} : {st:'bad', reason:'Khác số'};
  if(f.kind==='area'){
    const x=parseArea(a), y=parseArea(b);
    if(x==null||y==null) return clean(a)===clean(b) ? {st:'ok'} : {st:'bad', reason:'Khác nhau'};
    return Math.abs(x-y)<0.01 ? {st:'ok'} : {st:'bad', reason:`Lệch ${fmtNum(Math.abs(x-y))} m²`};
  }
  if(f.kind==='addr') return base(a)===base(b) ? {st:'ok'} : {st:'warn', reason:'Khác địa chỉ'};
  return base(a)===base(b) ? {st:'ok'} : {st:f.level, reason:'Khác nhau'};
}
function analyze(entries){
  const issues=[], rows=[];
  for(const f of FIELDS){
    const vals = entries.map(e=>({e, v:clean(e.p.fields?.[f.k])})).filter(x=>x.v);
    if(!vals.length) continue;
    const ref = vals.find(x=>x.e.doc.type==='cccd') || vals.find(x=>x.e.doc.type==='cmnd') || vals[0];
    const cells = entries.map(e=>{
      const v = clean(e.p.fields?.[f.k]);
      if(!v) return {v:null, st:'empty'};
      if(e===ref.e) return {v, st:'ref'};
      const r = cmp(f, ref.v, v);
      if(r.st!=='ok') issues.push({f, st:r.st, reason:r.reason, ref, other:{e, v}});
      return {v, st:r.st, reason:r.reason};
    });
    rows.push({f, cells});
  }
  return {issues, rows};
}

function suggestFolder(fields){
  const name = clean(fields?.ho_ten); if(!name) return null;
  const bn = base(name), dob = parseDate(fields.ngay_sinh);
  const ids = [digits(fields.so_cccd), digits(fields.so_cmnd)].filter(x=>x.length>=9);
  let best=null;
  for(const f of folders()){
    const ents = entriesFor(f.id);
    const fIds=new Set(), fDobs=[], fNames=new Set([base(f.name)]);
    ents.forEach(e=>{ const x=e.p.fields||{}; [digits(x.so_cccd),digits(x.so_cmnd)].forEach(v=>v&&fIds.add(v)); const d=parseDate(x.ngay_sinh); if(d) fDobs.push(d); if(x.ho_ten) fNames.add(base(x.ho_ten)); });
    let score=0, why='';
    if(ids.some(i=>fIds.has(i))){ score=100; why='Trùng số giấy tờ'; }
    else if(fNames.has(bn)){
      const sameY = dob && fDobs.some(d=>d.y===dob.y);
      const diffY = dob && fDobs.length && !sameY;
      if(diffY){ score=45; why='Trùng tên nhưng khác năm sinh'; }
      else { score = sameY ? 90 : 72; why = sameY ? 'Trùng tên và năm sinh' : 'Trùng tên'; }
    } else if(dob && dob.d && fDobs.some(d=>d.y===dob.y && d.m===dob.m) && [...fNames].some(n=>lev(n,bn)<=3)){
      score=62; why='Tên gần giống, trùng năm sinh';
    }
    if(score>(best?.score||0)) best={id:f.id, score, why};
  }
  return best && best.score>=60 ? best : null;
}

/* ---------- Bộ đọc chữ offline (Tesseract, tiếng Việt). Lần đầu tải ~2 MB, sau đó dùng không cần mạng ---------- */
const TESS_JS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const TESS_LANG='https://cdn.jsdelivr.net/npm/@tesseract.js-data/vie@1.0.0/4.0.0_best_int';

async function ocrCached(){
  try{ const c=await caches.open('runtime-v1'); const keys=(await c.keys()).map(r=>r.url);
    return keys.some(u=>u.includes('tesseract.min.js')) && keys.some(u=>/tesseract-core.*\.wasm\.js/.test(u)) && keys.some(u=>u.includes('vie.traineddata')); }catch(e){ return false; }
}
let ocrWorker=null, ocrP=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Chưa tải được bộ đọc chữ. Lần đầu dùng cần có mạng.')); document.head.appendChild(s); }); }

  else if(/recogniz/i.test(m.status)) el.textContent=`Đang đọc trang ${(S.ocrPage||0)+1}/${S.pages.length}… ${pct}%`;

async function saveDraft(){
  const d = S.draft; if(!d) return;
  const btn = $('#saveBtn'); if(btn){ btn.disabled=true; btn.textContent='Đang lưu…'; }
  try{
    const docId = uid('d'); const createdFolders = {};
    const people = [];
    for(const p of d.people){
      let folderId = null;
      if(p.sel==='new' && clean(p.fields.ho_ten)){
        const key = base(p.fields.ho_ten);
        if(!createdFolders[key]){ const f={id:uid('f'), kind:'folder', name:titleCase(p.fields.ho_ten), createdAt:Date.now()}; await Store.put(f); createdFolders[key]=f.id; }
        folderId = createdFolders[key];

      people.push({role:p.role, fields:p.fields, folderId});
    }
    const imgIds = [];
    for(let i=0;i<S.pages.length;i++){ const iid = 'i_'+docId+'_'+i; await Store.putImg(iid, S.pages[i].data, docId); imgIds.push(iid); }
    await Store.put({id:docId, kind:'doc', type:d.type, scannedAt:Date.now(), docFields:d.docFields||{}, land:LAND_TYPES.has(d.type)?(d.land||{}):{}, people, imgIds, crops:S.pages.map(p=>!!p.quad), note:d.note||''});

const CR = {quad:null, drag:-1, page:null, ctx:null};
function setupCropper(){

function cropPt(e){ const r=$('#cropWrap').getBoundingClientRect(), o=CR.page.orig; return {x:Math.min(o.width,Math.max(0,(e.clientX-r.left)/r.width*o.width)), y:Math.min(o.height,Math.max(0,(e.clientY-r.top)/r.height*o.height)), rx:e.clientX-r.left, ry:e.clientY-r.top, r}; }

$('#main').addEventListener('pointerdown', e=>{

  const pt=cropPt(e), o=CR.page.orig;

$('#main').addEventListener('pointerup', cropUp);

async function cropAction(a, t){
  if(a==='crop'){ const i=+t.dataset.i, p=S.pages[i]; openCrop(p, {kind:'scan'}); S.phase='crop'; render(); window.scrollTo(0,0); return; }
  if(a==='cropSaved'){
    const d=getItem(S.route.id), i=+t.dataset.i, data=await Store.getImg(d.imgIds[i]); if(!data){ toast('Không tải được ảnh.'); return; }
    const img=new Image(); img.src=data; try{ await img.decode(); }catch(e){ toast('Không mở được ảnh.'); return; }
    const orig=scaled(img,2400), det=detectQuad(orig);
    openCrop({orig, quad:det?det.quad:null, rot:0}, {kind:'saved', docId:d.id, idx:i});
    go(S.tab, {view:'crop', id:d.id, from:S.route}); if(det) toast('Đã tự tìm mép giấy, kiểm tra rồi bấm Cắt ảnh'); return;
  }
  const p=CR.page; if(!p) return;
  if(a==='cropAuto'){ const d=detectQuad(p.orig); if(d){ CR.quad=d.quad.map(c=>({...c})); drawCrop(); toast('Đã tìm thấy mép giấy'); } else toast('Không tự tìm được mép giấy. Kéo 4 góc bằng tay.'); return; }
  if(a==='cropFull'){ CR.quad=fullQuad(p.orig); drawCrop(); return; }
  if(a==='cropRot'){ CR.rot=((CR.rot||0)+90)%360; t.textContent='Xoay 90°'+(CR.rot?` (${CR.rot}°)`:''); return; }
  if(a==='cropCancel'){ closeCrop(); return; }
  if(a==='cropDone'){
    const q=orderQuad(CR.quad), isFull=polyArea(q)>p.orig.width*p.orig.height*0.995;
    if(!isFull && polyArea(q)<p.orig.width*p.orig.height*0.01){ toast('Khung quá nhỏ, kéo rộng ra.'); return; }
    t.disabled=true; t.textContent='Đang cắt…'; await new Promise(r=>setTimeout(r,20));
    const changed = JSON.stringify(q)!==JSON.stringify(p.quad);
    p.quad = isFull ? null : q; if(changed) p.auto=false; p.rot=CR.rot||0;

      const d=getItem(CR.ctx.docId);
      if(d){ await Store.putImg(d.imgIds[CR.ctx.idx], p.data, d.id);
        const crops=d.imgIds.map((_,i)=>i===CR.ctx.idx ? (!!p.quad || !!d.crops?.[i]) : !!d.crops?.[i]);

function openCrop(page, ctx){ CR.page=page; CR.ctx=ctx; CR.rot=page.rot||0; CR.quad=(page.quad||fullQuad(page.orig)).map(c=>({...c})); CR.drag=-1; }

/* Ảnh đã lưu nhưng chưa cắt mép → tự cắt lại một lần ở chế độ nền */
async function recropSaved(){
  if(recropSaved.running || Store.mode==='loading') return; recropSaved.running=true;
  let n=0;
  try{
    for(const d of docs()){
      if(d.example || !d.imgIds?.length || d.cropTried) continue;
      if(Array.isArray(d.crops) && d.crops.length===d.imgIds.length && d.crops.every(Boolean)) continue;
      const crops=d.imgIds.map((_,i)=>!!d.crops?.[i]); let any=false;
      for(let i=0;i<d.imgIds.length;i++){
        if(crops[i]) continue;
        const data=await Store.getImg(d.imgIds[i]); if(!data) continue;
        const img=new Image(); img.src=data; try{ await img.decode(); }catch(e){ continue; }
        const orig=scaled(img,2400), det=detectQuad(orig); if(!det) continue;
        const p={orig, quad:det.quad, rot:0}; await buildPage(p);
        await Store.putImg(d.imgIds[i], p.data, d.id); crops[i]=true; any=true; n++;
        await new Promise(r=>setTimeout(r,30));
      }
      const cur=getItem(d.id); if(!cur) continue;
      const {id, printLayout, ...rest}=cur;
      await Store.put(any ? {...rest, id, crops, cropTried:true} : {...cur, cropTried:true});
    }
  }catch(e){}
  recropSaved.running=false;
  if(n){ toast(`Đã tự cắt mép ${n} ảnh đã lưu trước đây`); render(); }
}

  else { st.textContent='Chưa tải. Bấm nút dưới khi có mạng (wifi), khoảng 5–6 MB, chỉ tải một lần.'; if(b){ b.textContent='Tải sẵn bộ đọc chữ'; b.classList.remove('ghost'); } }
}
async function doBackup(btn){
  btn.disabled=true; btn.textContent='Đang gom dữ liệu…';
  try{
    const data={app:'ho-so-scan', version:1, exportedAt:new Date().toISOString(), items:[...Store.items.values()], imgs:await Store.allImgs()};
    const dt=new Date(), name=`ho-so-scan-${dt.getFullYear()}${p2(dt.getMonth()+1)}${p2(dt.getDate())}.json`;
    const file=new File([JSON.stringify(data)], name, {type:'application/json'});
    if(navigator.canShare?.({files:[file]})) await navigator.share({files:[file], title:name});
    else { const u=URL.createObjectURL(file); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); }
    toast('Đã tạo file sao lưu');
  }catch(e){ if(e?.name!=='AbortError') toast('Chưa sao lưu được: '+(e?.message||'lỗi')); }
  btn.disabled=false; btn.textContent='Sao lưu ra file';
}
async function doRestore(file){
  try{
    const data=JSON.parse(await file.text());
    if(data?.app!=='ho-so-scan' || !Array.isArray(data.items)) throw new Error('File không phải bản sao lưu của Hồ Sơ Scan.');
    for(const [id,v] of Object.entries(data.imgs||{})) await Store.putImg(id, v);
    for(const it of data.items) if(it && it.id) await Store.put(it);
    toast(`Đã khôi phục ${data.items.filter(x=>x.kind==='doc').length} giấy tờ`); render();
  }catch(e){ toast(e.message || 'Không đọc được file sao lưu.'); }
}

      <div class="vs">${FIELDS.filter(f=>clean(p.fields?.[f.k])).map(f=>`<span class="src">${f.label}</span><span class="val ${f.mono?'mono':''}">${esc(p.fields[f.k])}</span>`).join('')}</div>

    </section>`).join('')}

  </div>`;
}

/* ---------- Sự kiện ---------- */
function curDraft(){ return S.route?.view==='doc' ? S.editDoc : S.draft; }
document.addEventListener('click', async e=>{
  const z = e.target.closest('img[data-zoom]');
  if(z && !e.target.closest('#viewer')){ if(z.naturalWidth>1) openViewer(z); return; }
  const t = e.target.closest('[data-tab],[data-act],[data-open-doc],[data-open-folder],[data-type],[data-fv],[data-ftag]');
  if(!t) return;
  if(t.hasAttribute('data-ftag')){ S.ftag = t.dataset.ftag || null; render(); return; }
  if(t.dataset.tab){ if(S.route) S.editDoc=null; go(t.dataset.tab); return; }
  if(t.dataset.openDoc){ S.editDoc=null; go(S.tab, {view:'doc', id:t.dataset.openDoc, from:S.route}); return; }

  if(a==='manual') return startManual();

  if(a==='cancelScan'){ S.pages=[]; S.draft=null; S.phase='idle'; S.err=null; render(); return; }
  if(a==='addPerson'){ const d=curDraft(); const roles=ROLE_BY_TYPE[d.type]; d.people.push({role:roles[Math.min(d.people.length,roles.length-1)], fields:{}, sel:'none', sug:null}); render(); return; }

    S.confirm=null; for(const x of [...Store.items.values()].filter(x=>x.example)) await Store.del(x.id); toast('Đã xoá dữ liệu mẫu'); render(); return;
  }
  if(a==='editDoc'){ const d=getItem(S.route.id); S.editDoc = JSON.parse(JSON.stringify({id:d.id, type:d.type, docFields:d.docFields||{}, land:d.land||{}, note:d.note||'', people:(d.people||[]).map(p=>({role:p.role, fields:{...p.fields}, sel:p.folderId||'none', sug:null}))})); render(); return; }
  if(a==='cancelEdit'){ S.editDoc=null; render(); return; }
  if(a==='saveEdit'){
    const ed=S.editDoc, d=getItem(ed.id); const people=[];
    for(const p of ed.people){
      let folderId=null;
      if(p.sel==='new' && clean(p.fields.ho_ten)){ const f={id:uid('f'),kind:'folder',name:titleCase(p.fields.ho_ten),createdAt:Date.now()}; await Store.put(f); folderId=f.id; }
      else if(p.sel && p.sel!=='none' && p.sel!=='new') folderId=p.sel;
      people.push({role:p.role, fields:p.fields, folderId});
    }
    const {id, ...rest} = d;
    try{ await Store.put({...rest, id, type:ed.type, docFields:ed.docFields, land:LAND_TYPES.has(ed.type)?(ed.land||{}):{}, people}); S.editDoc=null; toast('Đã lưu thay đổi'); }catch(err){ toast('Chưa lưu được. Thử lại.'); }
    render(); return;
  }
  if(a==='delDoc'){
    if(S.confirm!=='delDoc'){ S.confirm='delDoc'; render(); setTimeout(()=>{ if(S.confirm==='delDoc'){S.confirm=null; render();} },3500); return; }
    const d=getItem(S.route.id); S.confirm=null;
    for(const i of d.imgIds||[]) await Store.delImg(i);
    await Store.del(d.id); toast('Đã xoá giấy tờ'); S.route = S.route.from || null; render(); return;
  }
  if(a && a.startsWith('crop')) return cropAction(a, t);
  if(a==='openPrint') return openPrint(S.route.id);
  if(a==='openSettings'){ go(S.tab, {view:'settings', from:S.route}); showOcrState(); try{ const e=await navigator.storage?.estimate?.(); if(e && $('#usage')) $('#usage').textContent=` · dùng ${(e.usage/1048576).toFixed(1)} MB`; }catch(_){} return; }
  if(a==='backup') return doBackup(t);
  if(a==='preloadOcr'){ t.disabled=true; t.textContent='Đang tải… (khoảng 5–6 MB)'; try{ await getOcr(); await new Promise(r=>setTimeout(r,800)); }catch(e){ toast(e.message); } t.disabled=false; showOcrState(); return; }
  if(a==='wipe'){ if(S.confirm!=='wipe'){ S.confirm='wipe'; render(); setTimeout(()=>{ if(S.confirm==='wipe'){ S.confirm=null; render(); } },3500); return; } S.confirm=null; await Store.clearAll(); toast('Đã xoá toàn bộ dữ liệu'); render(); return; }
  if(a && a.startsWith('pr_') && S.route?.view==='print') return printAction(a, t);
  if(a==='addTag') return addTag();
  if(a==='rmTag'){
    const f=getItem(S.route.id); if(!f) return; const {id,...rest}=f;
    try{ await Store.put({...rest, id, tags:(f.tags||[]).filter(x=>x!==t.dataset.tag)}); }catch(err){ toast('Chưa bỏ được hashtag. Thử lại.'); }
    render(); return;

async function addTag(){
  const inp=$('#tagIn'); const v=normTag(inp?.value); if(!v){ inp?.focus(); return; }

/* ---------- Xem ảnh: chạm mở (phóng từ ảnh nhỏ), nhấp đôi phóng to / thu nhỏ, chụm 2 ngón, kéo, vuốt chuyển ảnh ---------- */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V = {list:[], i:0, s:1, tx:0, ty:0, fit:null, ptrs:new Map(), g:null, moved:false, pinched:false, lastTap:0, lastPos:null, tapT:null};
const vEl=$('#viewer'), vStage=$('#vStage'), vImg=$('#vImg');
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
function vApply(anim){ vImg.style.transition = anim && !REDUCE ? 'transform .26s cubic-bezier(.2,.8,.2,1)' : 'none'; vImg.style.transform = `translate(${V.tx}px,${V.ty}px) scale(${V.s})`; $('#vZoom').textContent = V.s>1.02 ? Math.round(V.s*100)+'%' : ''; }
function vFit(nw,nh){ const st=vStage.getBoundingClientRect(); const k=Math.min(st.width/nw, (st.height-40)/nh); const w=nw*k, h=nh*k; return {left:(st.width-w)/2, top:(st.height-h)/2, w, h, W:st.width, H:st.height, sx:st.left, sy:st.top}; }
function vClamp(){
  const f=V.fit, sw=f.w*V.s, sh=f.h*V.s;
  V.tx = sw<=f.W ? (f.W-sw)/2-f.left : Math.min(-f.left, Math.max(f.W-sw-f.left, V.tx));
  V.ty = sh<=f.H ? (f.H-sh)/2-f.top : Math.min(-f.top, Math.max(f.H-sh-f.top, V.ty));
}
function vFromThumb(src){ const r=src.getBoundingClientRect(), f=V.fit, k=r.width/f.w; V.s=k; V.tx=r.left-f.sx-f.left; V.ty=r.top-f.sy-f.top+(r.height-f.h*k)/2; }
function vShow(fromThumb){
  const src=V.list[V.i]; vImg.src=src.src;
  const f=V.fit=vFit(src.naturalWidth, src.naturalHeight);
  Object.assign(vImg.style,{left:f.left+'px', top:f.top+'px', width:f.w+'px', height:f.h+'px'});
  $('#vCount').textContent = V.list.length>1 ? `Trang ${V.i+1} / ${V.list.length}` : '';
  $('#vPrev').hidden = $('#vNext').hidden = V.list.length<2;
  if(fromThumb && !REDUCE && src.isConnected){
    vFromThumb(src); vApply(false); vEl.classList.remove('on');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ vEl.classList.add('on'); V.s=1; V.tx=0; V.ty=0; vApply(true); }));
  } else { vEl.classList.add('on'); V.s=1; V.tx=0; V.ty=0; vApply(false); }
}
function openViewer(img){
  const gal = img.closest('[data-gallery]');
  V.list = gal ? [...gal.querySelectorAll('img[data-zoom]')].filter(i=>i.naturalWidth>1) : [img];
  V.i = Math.max(0, V.list.indexOf(img));
  vEl.hidden=false; document.body.style.overflow='hidden';
  vShow(true);
  const h=$('#vHint'); h.style.opacity=1; clearTimeout(h.t); h.t=setTimeout(()=>h.style.opacity=0, 2600);
  $('#vClose').focus({preventScroll:true});
}
function closeViewer(){
  if(vEl.hidden) return;
  const src=V.list[V.i]; vEl.classList.remove('on');
  if(src?.isConnected && !REDUCE){ vFromThumb(src); vApply(true); }
  setTimeout(()=>{ vEl.hidden=true; document.body.style.overflow=''; vImg.removeAttribute('src'); }, REDUCE?0:260);
}
function vNav(d){ if(V.list.length<2) return; V.i=(V.i+d+V.list.length)%V.list.length; vShow(false); }
function vZoomAt(pt, s2){
  const f=V.fit; s2=Math.min(6, Math.max(1, s2));
  const lx=(pt.x-f.sx-f.left-V.tx)/V.s, ly=(pt.y-f.sy-f.top-V.ty)/V.s;
  V.tx=pt.x-f.sx-f.left-lx*s2; V.ty=pt.y-f.sy-f.top-ly*s2; V.s=s2; vClamp();
}
function vInside(pt){ const r=vImg.getBoundingClientRect(); return pt.x>=r.left && pt.x<=r.right && pt.y>=r.top && pt.y<=r.bottom; }
function vStart(){ const p=[...V.ptrs.values()]; V.g={s0:V.s, tx0:V.tx, ty0:V.ty, p0:p.map(x=>({...x}))}; if(p.length>=2){ V.g.d0=dist(p[0],p[1]); V.g.m0=mid(p[0],p[1]); V.pinched=true; } }
vStage.addEventListener('pointerdown', e=>{
  vStage.setPointerCapture(e.pointerId);
  if(!V.ptrs.size){ V.moved=false; V.pinched=false; }
  V.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); vStart();
});
vStage.addEventListener('pointermove', e=>{
  if(!V.ptrs.has(e.pointerId)) return;
  V.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const p=[...V.ptrs.values()], g=V.g, f=V.fit;
  if(p.length>=2 && g.d0){
    const m=mid(p[0],p[1]), s=Math.min(6, Math.max(.7, g.s0*dist(p[0],p[1])/g.d0));
    const lx=(g.m0.x-f.sx-f.left-g.tx0)/g.s0, ly=(g.m0.y-f.sy-f.top-g.ty0)/g.s0;
    V.s=s; V.tx=m.x-f.sx-f.left-lx*s; V.ty=m.y-f.sy-f.top-ly*s; V.moved=true; vApply(false);
  } else if(p.length===1 && g.p0[0]){
    const dx=p[0].x-g.p0[0].x, dy=p[0].y-g.p0[0].y;
    if(Math.hypot(dx,dy)>8) V.moved=true;
    if(!V.moved) return;
    if(V.s>1.01){ V.tx=g.tx0+dx; V.ty=g.ty0+dy; } else if(!V.pinched){ V.tx=dx; V.ty=0; }
    vApply(false);
  }
});
function vEnd(e){
  if(!V.ptrs.has(e.pointerId)) return;
  V.ptrs.delete(e.pointerId);
  if(V.ptrs.size){ vStart(); return; }
  const pt={x:e.clientX, y:e.clientY};
  if(!V.moved){
    const now=Date.now();
    if(now-V.lastTap<320 && V.lastPos && dist(pt,V.lastPos)<40){
      clearTimeout(V.tapT); V.lastTap=0;
      if(V.s>1.01){ V.s=1; V.tx=0; V.ty=0; } else vZoomAt(pt, 2.5);
      vApply(true);
    } else {
      V.lastTap=now; V.lastPos=pt;
      V.tapT=setTimeout(()=>{ if(V.s<=1.01 && !vInside(pt)) closeViewer(); }, 320);
    }
    return;
  }
  if(V.s<=1.01 && !V.pinched && Math.abs(V.tx)>70 && V.list.length>1){ vNav(V.tx<0?1:-1); return; }
  if(V.s<1.05){ V.s=1; V.tx=0; V.ty=0; } else vClamp();
  vApply(true);
}
vStage.addEventListener('pointerup', vEnd);
vStage.addEventListener('pointercancel', vEnd);
vStage.addEventListener('wheel', e=>{ e.preventDefault(); vZoomAt({x:e.clientX,y:e.clientY}, V.s*Math.exp(-e.deltaY*0.002)); vApply(false); }, {passive:false});
$('#vClose').addEventListener('click', closeViewer);
$('#vPrev').addEventListener('click', ()=>vNav(-1));
$('#vNext').addEventListener('click', ()=>vNav(1));
document.addEventListener('keydown', e=>{ if(vEl.hidden) return; if(e.key==='Escape') closeViewer(); if(e.key==='ArrowLeft') vNav(-1); if(e.key==='ArrowRight') vNav(1); });
addEventListener('resize', ()=>{ if(!vEl.hidden) vShow(false); });

/* ---------- In A4: bố cục kéo/thả/zoom, xuất PDF → bảng chia sẻ iOS → In (AirPrint qua WiFi) ---------- */
const A4W=210, A4H=297, MARGIN=6;
const isCardType = t => t==='cccd' || t==='cmnd';
let jspdfP=null;
function loadJsPDF(){
  return jspdfP ||= new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=()=>res(window.jspdf); s.onerror=()=>{ jspdfP=null; rej(new Error('Không tải được bộ tạo PDF.')); };
    document.head.appendChild(s);
  });
}
function dims(it){ const im=S.print.imgs[it.img]; const a=im.nh/im.nw; const r90=it.rot%180!==0; return {bw:it.w, bh: r90 ? it.w/a : it.w*a, r90}; }
const center = it => { const d=dims(it); return {x:it.x+d.bw/2, y:it.y+d.bh/2}; };
function placeCenter(it,c){ const d=dims(it); it.x=c.x-d.bw/2; it.y=c.y-d.bh/2; }
function fitA4(it){
  const im=S.print.imgs[it.img]; const r90=it.rot%180!==0; const asp = r90 ? im.nw/im.nh : im.nh/im.nw;
  const w = Math.min(A4W-2*MARGIN, (A4H-2*MARGIN)/asp); it.w=w; placeCenter(it,{x:A4W/2, y:A4H/2});
}
/* Thẻ đã cắt đúng mép → in đúng cỡ thật 85,6 × 54 mm như bản photo; chưa cắt → in to 120 mm */
const cardW = (im, cut) => cut ? (im.nw>=im.nh ? 85.6 : 53.98) : 120;
function defaultLayout(type, imgs, crops){
  if(isCardType(type)){
    const pages=[];
    for(let i=0;i<imgs.length;i+=2){
      const grp=[i,i+1].filter(j=>j<imgs.length), gap=14, top=25;
      const cut = Array.isArray(crops) && grp.every(j=>crops[j]);
      let ws=grp.map(j=>cardW(imgs[j],cut)), hs=grp.map((j,n)=>ws[n]*imgs[j].nh/imgs[j].nw);
      const room=A4H-2*top-gap*(grp.length-1), tot=hs.reduce((a,b)=>a+b,0);
      if(tot>room){ const f=room/tot; ws=ws.map(w=>w*f); hs=hs.map(h=>h*f); }
      let y=top; pages.push({items:grp.map((j,n)=>{ const it={img:j, x:(A4W-ws[n])/2, y, w:ws[n], rot:0}; y+=hs[n]+gap; return it; })});
    }
    return pages;
  }
  return imgs.map((im,j)=>{ const it={img:j, x:0, y:0, w:0, rot:0}; S.print.imgs=S.print.imgs||imgs; fitA4(it); return {items:[it]}; });
}
async function openPrint(id){
  const d=getItem(id); if(!d) return;
  S.print={docId:id, loading:true}; go(S.tab, {view:'print', id, from:S.route});
  loadJsPDF().catch(()=>{});
  const imgs=[];
  for(const iid of d.imgIds||[]){
    const data=await Store.getImg(iid); if(!data) continue;
    const im=new Image(); im.src=data;
    try{ await im.decode(); }catch(e){ continue; }
    imgs.push({data, nw:im.naturalWidth, nh:im.naturalHeight});
  }
  if(!imgs.length){ toast('Không tải được ảnh của giấy tờ này.'); S.route=S.route?.from||null; render(); return; }
  S.print={docId:id, imgs, sel:null, card:isCardType(d.type)};
  const saved=d.printLayout?.pages;
  const ok = Array.isArray(saved) && saved.length && saved.every(p=>Array.isArray(p.items) && p.items.every(it=>it.img<imgs.length));
  S.print.crops = d.crops;
  S.print.pages = ok ? JSON.parse(JSON.stringify(saved)) : defaultLayout(d.type, imgs, d.crops);
  S.print.saved = !!ok;
  if(S.route?.view==='print') render();
}
const selItem = () => { const s=S.print?.sel; return s ? S.print.pages[s.p]?.items[s.i] : null; };
const pct = (v,base) => (v/base*100).toFixed(3)+'%';
function boxStyle(it){ const d=dims(it); return `left:${pct(it.x,A4W)};top:${pct(it.y,A4H)};width:${pct(d.bw,A4W)};height:${pct(d.bh,A4H)}`; }
function imgStyle(it){ const d=dims(it); return `width:${((d.r90?d.bh/d.bw:1)*100).toFixed(3)}%;height:${((d.r90?d.bw/d.bh:1)*100).toFixed(3)}%;transform:translate(-50%,-50%) rotate(${it.rot}deg)`; }
function viewPrint(id){
  const pr=S.print;
  if(!pr || pr.docId!==id || pr.loading) return `<div class="card reading"><div class="spinner"></div><p class="muted" style="margin:0">Đang tải ảnh…</p></div>`;
  const sel=pr.sel, it=selItem();
  const tools = it ? (()=>{ const d=dims(it); return `
      <div class="row" style="justify-content:space-between"><b>Ảnh ${it.img+1}</b><span class="muted small mono" id="psizeLbl">${Math.round(d.bw)} × ${Math.round(d.bh)} mm</span></div>
      <input type="range" id="psize" min="20" max="330" step="1" value="${Math.round(it.w)}" aria-label="Kích thước ảnh trên giấy">
      <div class="row"><button class="btn sm" data-act="pr_fit">Full A4</button><button class="btn sm" data-act="pr_center">Căn giữa</button><button class="btn sm" data-act="pr_rot">Xoay 90°</button><button class="btn sm primary" data-act="pr_done">Xong</button></div>
      ${pr.card?`<button class="btn sm ghost" data-act="pr_real">Cỡ thẻ thật 85,6 × 54 mm</button>`:''}`; })()
    : `<button class="btn primary block" data-act="pr_print">${ICON.printer}In A4 · ${pr.pages.length} tờ</button>
       <button class="btn block" data-act="pr_pdf">Chia sẻ / lưu PDF</button>
       <button class="btn ghost block sm" data-act="pr_reset">Đặt lại bố cục mặc định</button>`;
  return `<div class="stack">
    <p class="muted small" style="margin:0">${pr.card?'CCCD/CMND: các mặt in chung một tờ A4.':'Mặc định: mỗi ảnh in full một tờ A4.'} Chạm ảnh để chọn, rồi kéo để di chuyển, chụm 2 ngón hoặc kéo chấm tròn để đổi cỡ.</p>
    ${pr.pages.map((pg,pi)=>`<div class="sheet-wrap"><div class="sheet ${sel&&sel.p===pi?'editing':''}" data-page="${pi}">
      ${pg.items.map((x,ii)=>{ const on=sel&&sel.p===pi&&sel.i===ii; return `<div class="pi ${on?'sel':''}" data-i="${ii}" style="${boxStyle(x)}"><img src="${pr.imgs[x.img].data}" alt="Ảnh ${x.img+1}" style="${imgStyle(x)}">${on?'<span class="h" aria-hidden="true"></span>':''}</div>`; }).join('')}
      </div><span class="muted small">Tờ ${pi+1} / ${pr.pages.length} · A4 210 × 297 mm</span></div>`).join('')}
    <div class="ptools card">${tools}</div>
  </div>`;
}
function updateItemEl(){
  const s=S.print.sel, it=selItem(); if(!it) return;
  const el=document.querySelector(`.sheet[data-page="${s.p}"] .pi[data-i="${s.i}"]`); if(!el) return;
  el.setAttribute('style', boxStyle(it)); el.querySelector('img').setAttribute('style', imgStyle(it));
  const d=dims(it); const l=$('#psizeLbl'); if(l) l.textContent=`${Math.round(d.bw)} × ${Math.round(d.bh)} mm`;
  const r=$('#psize'); if(r && document.activeElement!==r) r.value=Math.round(it.w);
}
async function printAction(a){
  const pr=S.print, it=selItem();
  if(a==='pr_done'){ pr.sel=null; render(); return; }
  if(a==='pr_fit' && it){ fitA4(it); render(); return; }
  if(a==='pr_real' && it){ const c=center(it), d=dims(it); it.w = d.bw>=d.bh ? 85.6 : 53.98; placeCenter(it,c); render(); return; }
  if(a==='pr_center' && it){ placeCenter(it,{x:A4W/2, y:A4H/2}); render(); return; }
  if(a==='pr_rot' && it){
    const c=center(it); it.rot=(it.rot+90)%360; placeCenter(it,c);
    const d=dims(it); if(d.bw>A4W-2*MARGIN+0.5 || d.bh>A4H-2*MARGIN+0.5) fitA4(it);
    render(); return;
  }
  if(a==='pr_reset'){ const d=getItem(pr.docId); pr.pages=defaultLayout(d.type, pr.imgs, d.crops); pr.sel=null; render(); toast('Đã đặt lại bố cục'); return; }
  if(a==='pr_print') return printNow();
  if(a==='pr_pdf') return sharePdf();
}
async function rotatedData(im, rot){
  if(!rot) return im.data;
  const img=new Image(); img.src=im.data; await img.decode();
  const c=document.createElement('canvas'); const r90=rot%180!==0;
  c.width = r90 ? im.nh : im.nw; c.height = r90 ? im.nw : im.nh;
  const g=c.getContext('2d'); g.translate(c.width/2, c.height/2); g.rotate(rot*Math.PI/180); g.drawImage(img, -im.nw/2, -im.nh/2);
  return c.toDataURL('image/jpeg', 0.92);
}
async function buildPrintArea(){
  const pr=S.print, area=$('#printArea'); area.innerHTML='';
  for(const pg of pr.pages){
    const sheet=document.createElement('div'); sheet.className='pp';
    for(const it of pg.items){ const d=dims(it); const img=new Image(); img.src=await rotatedData(pr.imgs[it.img], it.rot);
      img.style.cssText=`left:${it.x}mm;top:${it.y}mm;width:${d.bw}mm;height:${d.bh}mm`; sheet.appendChild(img); try{ await img.decode(); }catch(e){} }
    area.appendChild(sheet);
  }
}
function rememberLayout(){ const d=getItem(S.print.docId); if(d && !d.example){ Store.put({...d, printLayout:{pages:S.print.pages}}).catch(()=>{}); } return d; }
async function printNow(){
  const btn=document.querySelector('[data-act="pr_print"]'); const label=btn?.innerHTML;
  if(btn){ btn.disabled=true; btn.textContent='Đang chuẩn bị bản in…'; }
  try{ await buildPrintArea(); rememberLayout(); window.print(); }
  catch(e){ toast('Không mở được hộp thoại in. Dùng "Chia sẻ PDF" để in.'); }
  if(btn && btn.isConnected){ btn.disabled=false; btn.innerHTML=label; }
}
async function sharePdf(){
  const btn=document.querySelector('[data-act="pr_pdf"]'); const label=btn?.innerHTML;
  if(btn){ btn.disabled=true; btn.textContent='Đang tạo PDF…'; }
  try{
    const {jsPDF} = await loadJsPDF();
    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true}), pr=S.print;
    for(let pi=0; pi<pr.pages.length; pi++){ if(pi) pdf.addPage('a4','portrait');
      for(const it of pr.pages[pi].items){ const d=dims(it); pdf.addImage(await rotatedData(pr.imgs[it.img], it.rot), 'JPEG', it.x, it.y, d.bw, d.bh, undefined, 'FAST'); } }
    const d=rememberLayout(); const names=(d?.people||[]).map(p=>titleCase(p.fields?.ho_ten||'')).filter(Boolean);
    const file=new File([pdf.output('blob')], `${names[0]||'Giay to'} - ${TYPES[d?.type]?.short||'Giay to'}.pdf`, {type:'application/pdf'});
    if(navigator.canShare?.({files:[file]})) await navigator.share({files:[file], title:file.name});
    else { const u=URL.createObjectURL(file); const a=document.createElement('a'); a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 60000); }
  }catch(e){ if(e?.name!=='AbortError') toast(e?.message || 'Không tạo được PDF.'); }
  if(btn && btn.isConnected){ btn.disabled=false; btn.innerHTML=label; }
}
/* Cử chỉ trên tờ giấy */
const P={ptrs:new Map(), g:null};
function pStart(sh, mode){
  const it=selItem(); if(!it) return; const r=sh.getBoundingClientRect(); const pts=[...P.ptrs.values()];
  P.g={sh, k:A4W/r.width, x0:it.x, y0:it.y, w0:it.w, c0:center(it), p0:pts.map(p=>({...p})), mode: pts.length>=2 ? 'pinch' : (mode||'move')};
  if(pts.length>=2) P.g.d0=Math.max(10, dist(pts[0],pts[1]));
}
$('#main').addEventListener('pointerdown', e=>{
  if(S.route?.view!=='print' || !S.print?.pages) return;
  const sh=e.target.closest('.sheet'); if(!sh) return;
  const pg=+sh.dataset.page, pr=S.print, itEl=e.target.closest('.pi');
  if(!P.ptrs.size){
    const isSel = itEl && pr.sel && pr.sel.p===pg && pr.sel.i===+itEl.dataset.i;
    if(!isSel){
      if(itEl){ pr.sel={p:pg, i:+itEl.dataset.i}; render(); }
      else if(pr.sel){ pr.sel=null; render(); }
      return;
    }
  } else if(!P.g || P.g.sh!==sh) return;
  e.preventDefault();
  try{ sh.setPointerCapture(e.pointerId); }catch(_){}
  P.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  pStart(sh, e.target.closest('.h') && P.ptrs.size===1 ? 'resize' : null);
});
$('#main').addEventListener('pointermove', e=>{
  if(!P.g || !P.ptrs.has(e.pointerId)) return;
  P.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const it=selItem(), g=P.g, pts=[...P.ptrs.values()]; if(!it) return;
  if(g.mode==='pinch' && pts.length>=2){
    it.w=Math.min(330, Math.max(20, g.w0*dist(pts[0],pts[1])/g.d0)); placeCenter(it, g.c0);
  } else if(g.mode==='resize'){
    const dx=(pts[0].x-g.p0[0].x)*g.k, dy=(pts[0].y-g.p0[0].y)*g.k;
    const d0=dims({...it, w:g.w0}); const grow=Math.max(dx, dy*d0.bw/d0.bh);
    it.w=Math.min(330, Math.max(20, g.w0+grow)); it.x=g.x0; it.y=g.y0;
  } else if(g.mode==='move' && pts.length===1){
    it.x=g.x0+(pts[0].x-g.p0[0].x)*g.k; it.y=g.y0+(pts[0].y-g.p0[0].y)*g.k;
    const c=center(it); if(Math.abs(c.x-A4W/2)<2.5) placeCenter(it,{x:A4W/2, y:c.y});
  }
  updateItemEl();
});
function pEnd(e){
  if(!P.ptrs.has(e.pointerId)) return;
  P.ptrs.delete(e.pointerId);
  if(P.ptrs.size && P.g){ pStart(P.g.sh); return; }
  P.g=null;
}
$('#main').addEventListener('pointerup', pEnd);
$('#main').addEventListener('pointercancel', pEnd);

Store.on(()=>{ if(Store.mode!=='loading' && !recropSaved.started){ recropSaved.started=true; setTimeout(recropSaved, 1200); } });
Store.on(()=>{ if(P.g || CR.drag>=0) { renderTabs(); return; } const a=document.activeElement; if(a && (a.tagName==='INPUT'||a.tagName==='SELECT') && (S.phase==='review'||S.editDoc||a.id==='tagIn'||a.id==='rn')) { renderTabs(); return; } render(); });
const APP_VERSION='1.0.6';
render();
Store.init();
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; w?.addEventListener('statechange',()=>{ if(w.state==='installed' && navigator.serviceWorker.controller) toast('Đã có bản mới. Đóng và mở lại app để cập nhật.'); }); });
  }).catch(()=>{});
}
</script>
